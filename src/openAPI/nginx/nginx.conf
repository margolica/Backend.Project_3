worker_processes 1;


error_log /home/danil/nginx-error.log;
pid /home/danil/nginx.pid;

events {
    worker_connections 1024;
}

http {
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=all:32m;
    server {
        listen 82;
#         Переопределяет заголовок запроса
        proxy_set_header Host $host;
#         Фиксирует исходный IP адрес
        proxy_set_header X-Real-IP $remote_addr;
#         Создает список адресов по которым проходил запрос
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        server_name www.myApp.com myApp.com;

        location /api {
            proxy_pass http://localhost:8082/api/v1;
        }

        location = /api/v1/   {
            proxy_pass http://localhost:8082/swagger-ui/index.html;
        }

        location /api/v1/ {
            proxy_pass http://localhost:8082/swagger-ui/;
        }


        location /v3/api-docs/swagger-config {
            proxy_pass http://localhost:8082/v3/api-docs/swagger-config;
        }

        location /v3/api-docs {
            proxy_pass http://localhost:8082/v3/api-docs;
        }

        location /api/v1/favicon-16x16.png {
            root http://localhost:8082/swagger-ui/favicon-16x16.png;
        }

#         location ~ \.(css|js|png|html|json)$ {
#             proxy_pass http://localhost:8082/swagger-ui/;
#         }

        location / {
            root /home/danil/IdeaProjects/Backend.Project_3/src/openAPI/nginx/static;
            index index.html;
        }


    }
}
